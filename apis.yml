description: Creative Market is an online marketplace for community-generated design
  assets, where independent creators sell fonts, graphics, illustrations, templates,
  photos, icons, mockups, add-ons, and 3D assets to designers and businesses. Founded
  in 2012 and backed by 500 Global, the platform operates a storefront and seller
  dashboard model with per-product commercial licensing, an affiliate and ambassador
  program, a design blog, and enterprise sales. As of this enrichment pass Creative
  Market publishes no public developer API, API documentation, SDKs, or developer
  portal; this profile captures the company's identity, published policy and support
  surfaces, and a live domain-security probe.
